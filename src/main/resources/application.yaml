server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: dualis-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dualis_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

app:
  # Time zone that defines "the current month" (monthly bills, periods).
  timezone: ${APP_TIMEZONE:America/Lima}
  jwt:
    # Required. No default on purpose: the app refuses to start without it.
    secret: ${APP_JWT_SECRET:}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:7200000}
