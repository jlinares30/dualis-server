server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: dualis-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dualis_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345678}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

app:
  jwt:
    secret: ${APP_JWT_SECRET:DualisSecureSecretKeyForJWTTokenGeneration20261234567890}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:7200000}
